<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Favorite Artists</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-4">
    <h1 class="text-center mb-4">Favorite Artists</h1>

    <div class="row">
      <div class="col-sm-4">
        <img src="images/microphone.jpg" alt="Microphone illustration" class="img-fluid">
      </div>

      <div class="col-sm-8">
        <table class="table table-striped">
          <thead>
            <tr>
              <th>Artist</th>
              <th>Best Songs</th>
              <th>DOB (main)</th>
            </tr>
          </thead>
          <tbody id="artistTable"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
